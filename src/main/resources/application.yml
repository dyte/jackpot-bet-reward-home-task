spring:
  application:
    name: bet-jackpot
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: jackpot-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    admin:
      properties:
        bootstrap-servers: localhost:9092

  datasource:
    url: jdbc:h2:mem:jackpotdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

kafka:
  topic:
    jackpot-bets: jackpot-bets

# Jackpot configurations
jackpot:
  config:
    fixed-contribution-percentage: 5.0
    variable-contribution-initial-percentage: 10.0
    variable-contribution-min-percentage: 2.0
    fixed-reward-chance-percentage: 1.0
    variable-reward-initial-chance-percentage: 0.5
    variable-reward-pool-limit: 100_000.0